<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2591 3624" width="2591" height="3624">
  <!-- あとがきリスト 1 ページ分のテンプレート（spec.md 7.3）
       B5 + 塗り足し 3mm（188 x 263 mm）を 350dpi で 2591 x 3624 px として扱う -->

  <defs>
    <!-- アイコンを円形に切り抜く（spec.md 7.3）。objectBoundingBox 指定なので、画像自身の四角に内接する円になる -->
    <clipPath id="iconClip" clipPathUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.5" />
    </clipPath>
  </defs>

  <!-- 背景（塗り足し込みで白） -->
  <rect lcdParts="static" x="0" y="0" width="2591" height="3624" fill="#d3d3d3" />

  <!-- 関数呼び出し・funcArea・textArea・textLine の塗りは、配置を確認するための透明度 0.2 の目印（spec.md 7.3）。
       描画エンジンは描画しないため、プレビューと PNG には出ない。
       透明度は fill の末尾 2 桁（33）で指定する。opacity 属性は関数呼び出しの展開でブロック全体にコピーされるため使わない -->

  <!-- 参加者ブロックの定義（関数入力）。ブロックの比率は横 85:縦 57.5。funcArea の左上が呼び出し側 rect の左上に合わせられる -->
  <g lcd-funcDef="entryBlock">
    <rect lcdParts="funcArea" x="0" y="0" width="1130" height="764" fill="#80808033" />
    <rect lcdParts="static" x="0" y="0" width="1130" height="764" fill="#bcfcf9" />
    <rect lcdParts="static" x="0" y="450" width="1130" height="150" fill="#89fff9" />

    <rect x="50" y="50" width="250" height="250" fill="#80808033" />
    <!-- アイコン（25mm 角の四角に内接する円。正方形でない画像は中央を正方形に切り抜いてから円形にする） -->
    <image lcdParts="static" isDraw="$entry.icon" lcd-href="#{$entry.icon}"
           x="50" y="50" width="250" height="250" preserveAspectRatio="xMidYMid slice"
           clip-path="url(#iconClip)" />

    <!-- 名前（12pt 相当） -->
    <g lcdParts="text" lcdText="#{$entry.name}" lcd-overflow="name"
       lcd-holAlign="left" lcd-verAlign="top" breakType="1">
      <rect lcdParts="textArea" x="375" y="50" width="705" height="80" fill="#00a00033" />
      <rect lcdParts="textLine" x="375" y="50" width="705" height="80" fill="#ff800033"
            data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "700"}' />
    </g>

    <!-- 連絡先（9pt 相当・複数行） -->
    <g lcdParts="text" lcdText="#{$entry.contact}" lcd-overflow="contact"
       lcd-holAlign="left" lcd-verAlign="top" interval="10" breakType="1">
      <rect lcdParts="textArea" x="375" y="150" width="705" height="160" fill="#00a00033" />
      <rect lcdParts="textLine" x="375" y="150" width="705" height="50" fill="#ff800033"
            data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "400"}' />
    </g>

    <!-- あとがき本文（9pt 相当・複数行） -->
    <g lcdParts="text" lcdText="#{$entry.afterword}" lcd-overflow="afterword"
       lcd-holAlign="left" lcd-verAlign="top" interval="10" breakType="1">
      <rect lcdParts="textArea" x="50" y="325" width="1030" height="400" fill="#00a00033" />
      <rect lcdParts="textLine" x="50" y="325" width="1030" height="38" fill="#ff800033"
            data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "400"}' />
    </g>
  </g>

  <!-- 8 ブロックの呼び出し（左上から右へ、次の段へ） -->
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[0]" x="110" y="110" width="1130" height="764" fill="#6e6e6e00" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[1]" x="1351" y="110" width="1130" height="764" fill="#42426333" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[2]" x="110" y="990" width="1130" height="764" fill="#0000ff33" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[3]" x="1351" y="990" width="1130" height="764" fill="#0000ff33" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[4]" x="110" y="1870" width="1130" height="764" fill="#0000ff33" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[5]" x="1351" y="1870" width="1130" height="764" fill="#0000ff33" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[6]" x="110" y="2750" width="1130" height="764" fill="#0000ff33" />
  <rect lcd-funcCall="entryBlock" lcd-arg="entry:entries[7]" x="1351" y="2750" width="1130" height="764" fill="#0000ff33" />
</svg>
